$kind: http-request
method: PUT
url: '{{baseUrl}}/api/tasks/{{taskId}}'
order: 4000
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "title": "Updated Task Title",
      "completed": true
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status code is 200", function () {
        pm.response.to.have.status(200);
      });

      pm.test("Response title is updated", function () {
        const json = pm.response.json();
        pm.expect(json.title).to.eql("Updated Task Title");
      });

      pm.test("Response completed is true", function () {
        const json = pm.response.json();
        pm.expect(json.completed).to.be.true;
      });
