$kind: http-request
method: GET
url: '{{baseUrl}}/api/tasks/{{taskId}}'
order: 2000
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status code is 200", function () {
        pm.response.to.have.status(200);
      });

      pm.test("Response has required fields", function () {
        const json = pm.response.json();
        pm.expect(json).to.have.property('id');
        pm.expect(json).to.have.property('title');
        pm.expect(json).to.have.property('dueDate');
        pm.expect(json).to.have.property('completed');
      });

      pm.test("Response id matches requested id", function () {
        const json = pm.response.json();
        const requestedId = Number(pm.variables.get("taskId"));
        pm.expect(json.id).to.eql(requestedId);
      });
